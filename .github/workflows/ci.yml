name: CI

on:
  push:
    branches: [main]
  pull_request:

# A stale run on an outdated commit is just noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      # Placeholders so `prisma generate` and `next build` can run. No migration
      # is applied and nothing connects, so the value only needs to parse.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolfinder_ci
      # Long enough to satisfy the production guard in src/lib/auth.ts.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real-0000000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npx next build

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest

    # Catches a migration that is malformed or conflicts with the schema before
    # it reaches production — the school types and facilities migrations rewrite
    # existing columns, so this is worth its own job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolfinder_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolfinder_ci
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real-0000000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check schema matches migrations
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
